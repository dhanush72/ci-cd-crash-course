name: CI

on:
  push:
    branches:
      - master
  pull_request:
    - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@7

      - name: Set up Node.js
        uses: actions/setup-node@7 # uses - pre-defined github action
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify
